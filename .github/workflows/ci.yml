name: CI

on:
  push:
    branches: [main, feat/stoke-beta-foundation]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

jobs:
  # Core suite MUST pass without the azure extra (proves CC-004: core is
  # store-SDK and Foundry-SDK free). This is the CC-001..CC-008 gate.
  core:
    name: core (py${{ matrix.python-version }}, no azure extra)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package (dev extra only)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Pytest (core + conformance, no azure)
        run: pytest

  # Separate job WITH the azure extra: proves optional adapters import and the
  # suite still passes when the real SDKs are present.
  azure-extra:
    name: azure-extra (py3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install package (dev + azure extras)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,azure]"

      - name: Pytest (with azure extra)
        run: pytest
