name: Release (Python)

# Independent, language-scoped release. Triggered only by python-v* tags so
# future .NET tags never collide (coding-guidelines: per-language semver).
on:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel + SBOM
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine cyclonedx-bom

      - name: Build sdist + wheel
        run: python -m build

      - name: Twine check
        run: twine check dist/*

      - name: Generate CycloneDX SBOM
        # Kept out of dist/ so it is never uploaded to PyPI (packages only).
        run: cyclonedx-py environment --of json -o sbom.cyclonedx.json

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: python/dist/*
          if-no-files-found: error

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: python-sbom
          path: python/sbom.cyclonedx.json
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI (dry-run)
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # OIDC Trusted Publishing; no stored token
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI (protected)
    # PyPI only after the TestPyPI dry-run succeeds.
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi  # protected: requires manual approval
    permissions:
      id-token: write  # OIDC Trusted Publishing; no stored token
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
